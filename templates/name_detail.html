{% extends "base.html" %}

{% block title %}{{ name.name }} - Definition{% endblock %}

{% block content %}
<div class="box">
    <h3>Name Definition</h3>
    <div class="box-content">
        <h2 style="margin-top: 0;">{{ name.name }}</h2>
        <blockquote class="article-blockquote">
            {{ name.definition }}
        </blockquote>
        <p class="small-text">Added on {{ name.created_at }}</p>

        <hr>

        <h4>Share this name</h4>
        <div style="display: flex; gap: 10px;">
            <a href="https://twitter.com/intent/tweet?text=Check out the unofficial definition of {{ name.name }}: {{ request.url }}" target="_blank" class="btn">Share on Twitter</a>
            <a href="https://www.facebook.com/sharer/sharer.php?u={{ request.url }}" target="_blank" class="btn">Share on Facebook</a>
            <button onclick="navigator.clipboard.writeText('{{ request.url }}'); alert('Link copied!');" class="btn">Copy Link</button>
        </div>
    </div>
</div>
{% endblock %}
